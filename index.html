<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Diller Scofidio + Renfro</title>
  <link rel="stylesheet" href="https://use.typekit.net/maj8lgt.css">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <header class="site-header">
    <a class="logo" href="index.html">
      <picture>
        <source media="(max-width: 767px)" srcset="images/logo/dsr-logo.webp">
        <img src="images/logo/dsr-logo-inverse.webp" alt="Diller Scofidio + Renfro — Home">
      </picture>
    </a>
    <nav class="site-nav">
      <a href="projects.html">Projects</a>
      <a href="studio.html">Studio</a>
      <a href="contact.html">Contact</a>
      <a href="news.html">News</a>
    </nav>
  </header>

  <main>
    <section class="carousel" aria-roledescription="carousel" aria-label="Featured projects">
      <div class="carousel-slides">
        <figure class="slide is-active" style="--pos: 0% 50%; --pos-mobile: 33% 50%;">
          <img src="images/home/broad-expansion.webp" alt="The Broad Expansion">
          <figcaption><a href="the-broad-expansion.html"><strong>THE BROAD EXPANSION</strong><span>Los Angeles, CA</span></a></figcaption>
        </figure>
        <figure class="slide" style="--pos: 63% 50%; --pos-mobile: 50% 50%;">
          <img src="images/home/the-high-line.webp" alt="The High Line" loading="lazy">
          <figcaption><a href="the-high-line.html"><strong>THE HIGH LINE</strong><span>New York, NY</span></a></figcaption>
        </figure>
        <figure class="slide" style="--pos: 0% 50%; --pos-mobile: 27% 50%;">
          <img src="images/home/tianjin-juilliard.webp" alt="The Tianjin Juilliard School" loading="lazy">
          <figcaption><a href="tianjin-juilliard.html"><strong>THE TIANJIN JUILLIARD SCHOOL</strong><span>Tianjin, China</span></a></figcaption>
        </figure>
        <figure class="slide" style="--pos: 38% 50%; --pos-mobile: 53% 50%;">
          <img src="images/home/upper-montparnasse.webp" alt="Upper Montparnasse" loading="lazy">
          <figcaption><a href="upper-montparnasse.html"><strong>UPPER MONTPARNASSE</strong><span>Paris, France</span></a></figcaption>
        </figure>
        <figure class="slide" style="--pos: 50% 70%; --pos-mobile: 47% 50%;">
          <img src="images/home/al-mujadilah.webp" alt="Al-Mujadilah Center and Mosque for Women" loading="lazy">
          <figcaption><a href="al-mujadilah.html"><strong>AL-MUJADILAH CENTER AND MOSQUE FOR WOMEN</strong><span>Doha, Qatar</span></a></figcaption>
        </figure>
      </div>

      <div class="carousel-dots" role="group" aria-label="Choose slide">
        <button type="button" class="dot is-active" aria-label="Slide 1" aria-current="true"></button>
        <button type="button" class="dot" aria-label="Slide 2"></button>
        <button type="button" class="dot" aria-label="Slide 3"></button>
        <button type="button" class="dot" aria-label="Slide 4"></button>
        <button type="button" class="dot" aria-label="Slide 5"></button>
      </div>
    </section>
  </main>

  <footer class="site-footer">
    <a class="footer-logo" href="index.html">
      <img src="images/logo/dsr-logo-inverse.webp" alt="Diller Scofidio + Renfro — Home">
    </a>
    <div class="footer-info">
      <p>601 W. 26th Street, Suite 1815 New York, NY 10001</p>
      <p class="footer-links">
        <a href="tel:+12122607971">+1 212.260.7971</a>
        <a href="mailto:disco@dsrny.com">disco@dsrny.com</a>
      </p>
    </div>
  </footer>

  <script src="js/carousel.js"></script>
</body>
</html>
